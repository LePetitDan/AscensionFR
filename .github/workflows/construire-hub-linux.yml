# Construit le Hub AscensionFR pour Linux.
#
# POURQUOI CE WORKFLOW EXISTE. Depuis le programme 17, un joueur Linux peut
# cloner le dépôt et lancer `python compagnon_hub.py`. Ce n'est pas une
# distribution : il n'a rien à télécharger. Le coureur d'Actions EST la machine
# Linux qui manque au mainteneur, dont le poste est sous Windows.
#
# LES DEUX RÈGLES QUI NE SE DISCUTENT PAS
#   1. Le déclencheur est `workflow_dispatch`, et RIEN d'autre. Surtout pas
#      `pull_request_target`, qui exécuterait le code d'un fork AVEC les
#      secrets du dépôt. Le webhook des rapports est une autorisation
#      d'écriture à porteur : qui l'a écrit dans le salon des rapports.
#   2. Toute action tierce est épinglée à une EMPREINTE DE COMMIT, jamais à
#      une étiquette. Une étiquette se déplace — le projet a documenté ce que
#      ça coûte (programme 7).
#
# LES DEUX MODES, ET POURQUOI IL Y EN A DEUX
#   « diagnostic »   — ne touche PAS au secret, ne demande aucune approbation,
#                      et n'exporte QUE des captures d'écran. Le binaire est
#                      construit puis jeté : il ne peut donc pas circuler.
#                      C'est ce mode qui répond aux questions de machine
#                      (glibc, tkinter, polices, taille) sans rien risquer.
#   « distribution » — réclame le secret, échoue franchement s'il manque, et
#                      exporte le binaire en ARTEFACT DE RUN.
#
#   Le mode « diagnostic » n'est PAS une porte dérobée pour publier un binaire
#   muet : dans ce mode l'étape d'export du binaire ne s'exécute pas du tout.
#   C'est structurel, pas une convention.
#
# CE QU'IL NE FAIT PAS, ET C'EST VOULU
#   - il ne crée ni tag, ni release, ni pré-version. Le binaire sort en
#     ARTEFACT DE RUN, visible seulement dans l'onglet Actions : aucun des
#     Compagnons installés ne peut le voir, donc aucun joueur n'est exposé ;
#   - il ne donne pas la mise à jour automatique aux joueurs Linux : le relais
#     de remplacement est écrit en .bat Windows.

name: Construire le Hub (Linux)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic (sans secret, captures seules) ou distribution (avec secret, binaire)"
        required: true
        default: diagnostic
        type: choice
        options: [diagnostic, distribution]
      raison:
        description: "Pourquoi cette construction (apparaît dans le journal)"
        required: false
        default: "essai"

permissions:
  contents: read          # le jeton du workflow ne doit rien pouvoir écrire

jobs:
  construire:
    # ubuntu-22.04 DÉLIBÉRÉMENT, pas `ubuntu-latest` : un binaire PyInstaller se
    # lie à la glibc de la machine qui le construit et ne tourne PAS sur une
    # glibc plus ancienne. Construire sur le coureur le plus VIEUX disponible
    # est donc ce qui couvre le plus de joueurs. La version exacte est relevée
    # plus bas — on la mesure, on ne la suppose pas.
    runs-on: ubuntu-22.04

    # Le mode vient UNIQUEMENT de l'entrée du déclencheur manuel.
    env:
      MODE: ${{ inputs.mode }}

    # L'ENVIRONNEMENT EST LA PROTECTION, et il n'est demandé QUE si l'on veut
    # le secret. Avec « Required reviewers » coché, tout run en mode
    # « distribution » S'ARRÊTE et attend une approbation humaine, en affichant
    # la branche d'où part le code. Un workflow modifié par une PR fusionnée
    # par inadvertance ne peut donc rien obtenir tout seul.
    #
    # Corollaire, et c'est ce qui rend le mode « diagnostic » sûr : NE PAS
    # demander l'environnement, c'est ne pas recevoir ses secrets. Un run en
    # diagnostic ne peut donc pas lire le webhook, même par erreur de code.
    environment: ${{ inputs.mode == 'distribution' && 'publication' || '' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Relevé AVANT toute construction : ce sont les questions auxquelles il
      # faut une réponse mesurée, et elles ne coûtent que quelques secondes.
      - name: Relever la machine (glibc, tkinter, distribution)
        run: |
          set -eu
          echo "mode effectif : $MODE   raison : ${{ inputs.raison }}"
          echo "--- distribution ---"
          head -3 /etc/os-release
          echo "--- glibc : c'est à CELLE-CI que le binaire se liera ---"
          ldd --version | head -1
          getconf GNU_LIBC_VERSION
          echo "--- python ---"
          python -c "import sys; print(sys.version)"
          echo "--- tkinter, sans rien installer ? ---"
          python -c "import tkinter, _tkinter; print('tkinter OK — Tcl/Tk', _tkinter.TK_VERSION)"

      # ------------------------------------------------------------------ #
      # PROGRAMME 23 — CE QUE VOYAIT UN JOUEUR AVANT.
      # On n'affirme pas que les deux boutons plantaient : on rejoue les deux
      # chemins TELS QU'ILS ÉTAIENT (récupérés dans l'historique git), sur
      # cette machine-ci, et on regarde ce qui sort. Puis on rejoue les mêmes
      # chemins RÉPARÉS. La différence est la preuve.
      # ------------------------------------------------------------------ #
      - name: Installer de quoi lancer une interface sans écran
        run: |
          set -eu
          sudo apt-get update -qq
          # openbox : un VRAI gestionnaire de fenêtres. Sans lui, Xvfb tout nu
          # « mappe » les fenêtres instantanément et le piège du grab_set ne
          # se reproduit PAS — un banc qui ne peut pas voir le défaut ne
          # prouve rien de sa correction.
          sudo apt-get install -y -qq xvfb imagemagick x11-utils openbox

      - name: AVANT — les deux chemins qui plantaient, rejoués
        run: |
          set -eu
          mkdir -p captures
          echo "=== 1. « Lancer le jeu » : import winreg sans garde ==="
          python - <<'PY'
          import traceback
          try:
              import winreg          # exactement la ligne 485 d'origine
              print("winreg importé — on serait donc sous Windows ?!")
          except Exception:
              traceback.print_exc()
              print(">>> VOILÀ ce que faisait le bouton « Lancer le jeu ».")
          PY
          echo
          echo "=== 2. « Vérifier mon installation » : grab_set() d'origine ==="
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash -c '
            openbox --sm-disable & sleep 2
            python - <<"PY"
          import tkinter as tk, traceback
          racine = tk.Tk(); racine.geometry("300x200"); racine.update()

          # (a) LA REPRODUCTION DÉTERMINISTE. Une fenêtre que le serveur X n'a
          #     pas encore affichée, c'est exactement l'état où se trouve un
          #     Toplevel tout juste créé quand un gestionnaire de fenêtres
          #     prend son temps. On le force pour ne pas dépendre du hasard.
          f = tk.Toplevel(racine); f.withdraw()
          try:
              f.grab_set()
              print("(a) grab_set a réussi sur une fenêtre non affichée ?!")
          except tk.TclError:
              traceback.print_exc()
              print(">>> (a) VOILÀ l erreur de Tetardtek, reproduite.")

          # (b) LE CAS RÉEL, avec un vrai gestionnaire de fenêtres qui vient
          #     de démarrer. Il peut réussir ou échouer selon la course :
          #     on RELÈVE, on ne conclut pas.
          g = tk.Toplevel(racine); g.geometry("400x200"); g.transient(racine)
          try:
              g.grab_set()
              print("(b) avec openbox : grab_set a réussi du premier coup.")
          except tk.TclError as e:
              print("(b) avec openbox : ÉCHEC —", e)
          PY
          '

      - name: AVANT — la molette, et pourquoi personne ne l'aurait vue
        run: |
          set -eu
          xvfb-run -a --server-args="-screen 0 1280x800x24" python - <<'PY'
          import sys, tkinter as tk
          # ⚠️ LA FENÊTRE DOIT ÊTRE AFFICHÉE. Un premier essai gardait la
          # racine « withdraw » et le canvas non « pack » : event_generate ne
          # délivrait rien, la mesure rendait [] — et le banc imprimait quand
          # même sa conclusion. C'est le défaut qu'on soigne ; corrigé ici.
          racine = tk.Tk(); racine.geometry("400x300")
          c = tk.Canvas(racine, width=380, height=280)
          c.pack(fill="both", expand=True)
          racine.update()
          vus = []
          c.bind("<MouseWheel>", lambda e: vus.append(("MouseWheel", e.delta)))
          c.bind("<Button-4>",  lambda e: vus.append(("Button-4", e.delta)))
          c.bind("<Button-5>",  lambda e: vus.append(("Button-5", e.delta)))
          for seq in ("<Button-4>", "<Button-5>"):
              c.event_generate(seq, when="now")
          racine.update()
          print("événements reçus :", vus)
          if not vus:
              print("::error::la mesure n a RIEN reçu — elle ne prouve rien.")
              sys.exit(1)
          if any(nom == "MouseWheel" for nom, _ in vus):
              print("::error::<MouseWheel> a été reçu : X11 se comporterait "
                    "comme Windows, ce qui contredirait tout le raisonnement.")
              sys.exit(1)
          print("delta d un cran X11 :", [d for _, d in vus])
          assert all(d == 0 for _, d in vus), "delta devrait valoir 0"
          print(">>> un cran de molette arrive en Button-4/5, JAMAIS en")
          print("    <MouseWheel>, et delta vaut 0 : `delta // 120` rend 0.")
          print("    Le code d avant ne defilait PAS, et ne le disait pas.")
          PY

      # LA BARRIÈRE. En mode distribution, sans secret on s'arrête ICI,
      # bruyamment. Construire quand même produirait un binaire muet : le
      # bouton « Envoyer mon rapport » serait peint en gris et personne ne
      # saurait pourquoi. Un échec franc vaut mieux qu'un binaire qui a l'air
      # de marcher.
      - name: Barrière — le secret est-il présent ?
        if: env.MODE == 'distribution'
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_RAPPORTS }}
        run: |
          set -eu
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::error::WEBHOOK_RAPPORTS est absent de l'environnement « publication »."
            echo "Le binaire construit sans lui ne pourrait envoyer aucun rapport."
            echo "À faire : Settings > Environments > publication > Add secret,"
            echo "nom exact WEBHOOK_RAPPORTS."
            exit 1
          fi
          echo "secret présent (longueur ${#WEBHOOK}) — sa valeur n'est jamais affichée."

      # L'INJECTION. On n'invente pas de mécanisme : on reprend EXACTEMENT le
      # motif d'affectation de outils/secrets_publication.py (_motif_affectation),
      # celui qui sert à neutraliser dans l'autre sens. Et on reprend surtout sa
      # LEÇON : ce code a déjà eu un défaut où le motif s'accrochait à une paire
      # de guillemets vide, ne remplaçait rien, et annonçait « 1 secret
      # neutralisé ». On COMPTE donc les affectations, et une seule qui échappe
      # est un échec.
      #
      # Aucun `set -x`, aucun `cat` du fichier, aucun message qui recrache la
      # ligne : le secret transite par une variable d'environnement et n'est
      # jamais écrit sur la sortie.
      - name: Injecter le webhook dans la source
        if: env.MODE == 'distribution'
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_RAPPORTS }}
        run: |
          set -eu
          python - <<'PY'
          import io, os, re, sys

          CHEMIN = "compagnon/compagnon.py"
          NOM = "WEBHOOK_RAPPORTS"
          secret = os.environ["WEBHOOK"]

          texte = io.open(CHEMIN, encoding="utf-8").read()

          # Le motif de secrets_publication.py, à l'identique : le reste de la
          # ligne (le commentaire) est préservé, seule la VALEUR change.
          motif = re.compile(r"""(?m)^(\s*%s\s*=\s*)(["'])(?:\\.|(?!\2).)*\2"""
                             % re.escape(NOM))

          attendues = len(re.findall(r"(?m)^\s*%s\s*=" % re.escape(NOM), texte))
          if attendues != 1:
              print("::error::%d affectation(s) de %s trouvée(s), 1 attendue."
                    % (attendues, NOM))
              sys.exit(1)

          texte, faites = motif.subn(
              lambda m: "%s%s%s%s" % (m.group(1), m.group(2), secret, m.group(2)),
              texte)
          if faites != attendues:
              print("::error::%d affectation(s) traitée(s) sur %d."
                    % (faites, attendues))
              sys.exit(1)

          io.open(CHEMIN, "w", encoding="utf-8").write(texte)
          # On ne réaffiche RIEN du fichier. On prouve autrement :
          print("injection faite : %d affectation(s) traitée(s)" % faites)

          # Contrôle indépendant, toujours sans montrer la valeur.
          relu = io.open(CHEMIN, encoding="utf-8").read()
          vide = re.search(r'(?m)^\s*WEBHOOK_RAPPORTS\s*=\s*""', relu)
          print("la ligne est-elle encore vide :", bool(vide))
          print("occurrences du secret dans la source :", relu.count(secret))
          if vide or relu.count(secret) != 1:
              sys.exit(1)
          PY

      - name: Installer les dépendances
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow customtkinter lupa certifi
          # (xvfb / imagemagick sont installés plus haut : les épreuves
          #  « AVANT » en ont besoin avant même qu'on construise.)

      # Les mêmes deux chemins, RÉPARÉS, dans le code qui va être empaqueté.
      # On appelle les fonctions puisqu'on ne peut pas cliquer — c'est ce que
      # le programme 23 demande explicitement.
      - name: APRÈS — les deux chemins réparés, dans le vrai code
        working-directory: compagnon
        run: |
          set -eu
          echo "=== 1. _candidats_registre() — la fonction du bouton ==="
          python - <<'PY'
          import interface_hub
          r = interface_hub._candidats_registre()
          print("rendu :", r)
          assert r == [], "elle devrait rendre une liste vide hors Windows"
          print(">>> plus de ModuleNotFoundError : le bouton continue.")
          PY
          echo
          echo "=== 2. _fenetre() — le grab_set du bouton « Vérifier » ==="
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash -c '
            openbox --sm-disable & sleep 2
            python - <<"PY"
          import tkinter as tk
          import interface_hub

          # On appelle la VRAIE méthode, sur un objet qui n a que ce qu elle
          # lit — pas de Hub complet, donc pas de décor à charger.
          class Faux(tk.Tk):
              FOND_F, BORD_F = "#efe2c0", "#8a6a2a"
          racine = Faux(); racine.geometry("300x200"); racine.update()
          f = interface_hub.Hub._fenetre(racine, "Controle", 700, 480)
          racine.update()
          print("la fenetre existe :", bool(f.winfo_exists()))
          print("titre :", f.title())
          # On laisse tourner : c est pendant ce temps que la reprise
          # differee prend le grab si le premier essai a echoue.
          racine.after(1500, racine.quit)
          racine.mainloop()
          tenu = f.grab_current()
          print("qui tient le grab apres 1,5 s :", tenu)
          assert f.winfo_exists(), "la fenetre a disparu"
          print(">>> plus de TclError : le bouton ouvre bien sa fenetre.")
          PY
          '
          echo
          echo "=== 3. la molette relie bien les TROIS séquences ==="
          xvfb-run -a --server-args="-screen 0 1280x800x24" python - <<'PY'
          import tkinter as tk
          import interface_hub
          # Fenêtre AFFICHÉE et canvas POSÉ : sans ça event_generate ne
          # délivre rien et la mesure serait vide (voir l étape « AVANT »).
          racine = tk.Tk(); racine.geometry("400x300")
          c = tk.Canvas(racine, width=380, height=280)
          c.pack(fill="both", expand=True)
          racine.update()
          crans = []
          interface_hub.lier_molette(
              c, lambda e: crans.append(interface_hub.crans_molette(e)))
          for seq in ("<Button-4>", "<Button-5>"):
              c.event_generate(seq, when="now")
          racine.update()
          print("crans lus pour Button-4 puis Button-5 :", crans)
          assert crans == [1, -1], "la molette X11 doit rendre +1 puis -1"
          print(">>> le catalogue d addons et les deux fenetres defilent.")
          PY

      # Où va vraiment stderr dans un binaire FENÊTRÉ sous Linux ? C'est la
      # mesure qui manque au bloc 0 : sous Windows on a relevé
      # sys.stderr = None. Ici on regarde, on ne suppose pas.
      - name: Où va la sortie d'erreur d'un binaire fenêtré, sous Linux ?
        working-directory: compagnon
        run: |
          set -eu
          cat > /tmp/sonde_flux.py <<'PY'
          import sys, io, os
          releve = "/tmp/releve_flux.txt"
          with io.open(releve, "w", encoding="utf-8") as f:
              f.write("gelé            : %r\n" % getattr(sys, "frozen", False))
              f.write("sys.stdout      : %r\n" % (sys.stdout,))
              f.write("sys.stderr      : %r\n" % (sys.stderr,))
              f.write("sys.__stderr__  : %r\n" % (sys.__stderr__,))
          print("SONDE: ceci part sur stderr", file=sys.stderr)
          PY
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name sonde_flux /tmp/sonde_flux.py > /dev/null
          # Lancé SANS terminal attaché, comme un double-clic : fd 1 et 2
          # ferment. C'est le cas du joueur.
          ./dist/sonde_flux 0<&- 1>/dev/null 2>/dev/null || true
          echo "--- ce que la sonde a relevé d'elle-même ---"
          cat /tmp/releve_flux.txt
          echo
          echo "--- et avec un terminal (le cas de Tetardtek) ---"
          ./dist/sonde_flux
          echo ">>> Sous Linux les flux EXISTENT : le traceback est bien"
          echo "    écrit — simplement là où le joueur ne regarde jamais."

      # Le .spec du dépôt est écrit POUR WINDOWS et ne peut pas servir ici :
      #   runtime_tmpdir='%LOCALAPPDATA%\\AscensionFR_Compagnon'  (variable Windows)
      #   icon=['assets\\logo.ico']                               (chemin backslash, .ico)
      #   pathex=[.../outils]                                     (dossier PRIVÉ, absent du dépôt public)
      # Plutôt que d'ajouter un second .spec qui dériverait du premier sans que
      # personne s'en aperçoive, on traduit la recette en options, ligne pour
      # ligne. La correspondance est explicite :
      #   datas=[('assets','assets')]  -> --add-data assets:assets
      #   hiddenimports=['parser_wdb'] -> --hidden-import parser_wdb
      #
      # PIL._tkinter_finder N'est PAS dans le .spec Windows, et c'est normal :
      # sous Windows PyInstaller le trouve seul. Sous Linux, sans lui, Pillow
      # charge son extension _imagingtk mais la commande Tcl « PyImagingPhoto »
      # n'est jamais enregistrée -> TclError au premier decor.photo().
      # Trouvé en lançant, pas en lisant : le premier essai plantait sur
      # `self.decor.poser(self.canvas, "fond", 0, 0)`.
      #   collect_all(x)               -> --collect-all x
      #   console=False                -> --windowed
      - name: Construire le binaire
        working-directory: compagnon
        run: |
          set -eu
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name AscensionFR_Hub \
            --add-data "assets:assets" \
            --hidden-import parser_wdb \
            --hidden-import PIL._tkinter_finder \
            --collect-all customtkinter \
            --collect-all lupa \
            --collect-all certifi \
            compagnon_hub.py
          ls -la dist/
          python -c "import os; print('taille : %.1f Mo' % (os.path.getsize('dist/AscensionFR_Hub')/1048576))"

      # LA PREUVE QUI COMPTE : on LANCE vraiment le Hub, sur un écran virtuel,
      # dans les 5 vues, en mode --demo (aucun réseau, et surtout pas le
      # `after(2500, envoi_auto_au_lancement)` qui expédierait une récolte).
      # Le bouton « Envoyer mon rapport » n'est actif que si DEUX conditions
      # sont réunies (interface_hub.py l. 2282) :
      #     possible = bool(WEBHOOK_RAPPORTS and jeu_valide(self.jeu))
      # Sans dossier de jeu, il resterait gris même avec le webhook, et la
      # capture ne prouverait rien. On pose donc un faux dossier de jeu qui
      # satisfait `racine_jeu()` : « Interface » ET « Data » (compagnon.py
      # l. 165-176). Il est VIDE — aucun texte à récolter, donc rien à envoyer.
      - name: Poser un faux dossier de jeu (pour que le bouton soit jugeable)
        working-directory: compagnon
        run: |
          set -eu
          mkdir -p /tmp/faux_jeu/Interface /tmp/faux_jeu/Data
          python - <<'PY'
          import io, json, os
          # ⚠️ CHANGÉ AU PROGRAMME 23. Avant : CONFIG_DIR valait
          # os.environ.get("APPDATA", ".") -> "." sous Linux, donc la
          # configuration atterrissait dans le DOSSIER COURANT (un endroit
          # différent selon la façon de lancer le programme). Elle suit
          # maintenant la convention du système. On ne devine pas le chemin :
          # on le demande au moteur lui-même.
          import sys
          sys.path.insert(0, ".")
          import compagnon as logique
          os.makedirs(logique.CONFIG_DIR, exist_ok=True)
          io.open(logique.CONFIG, "w", encoding="utf-8").write(
              json.dumps({"jeu": "/tmp/faux_jeu", "envoi_auto": False}))
          print("config posée dans :", logique.CONFIG)
          PY
          echo "--- ce faux dossier est-il une racine de jeu valide ? ---"
          python -c "
          import os
          c='/tmp/faux_jeu'
          print('Interface :', os.path.isdir(os.path.join(c,'Interface')))
          print('Data      :', os.path.isdir(os.path.join(c,'Data')))
          "

      - name: Lancer le Hub — les 5 vues sur écran virtuel
        working-directory: compagnon
        run: |
          set -eu
          mkdir -p ../captures
          echec=0
          for v in accueil traduction voix addons contribuer; do
            echo "======== vue $v ========"
            xvfb-run -a --server-args="-screen 0 1280x800x24" bash -c "
              ./dist/AscensionFR_Hub --demo $v > /tmp/$v.log 2>&1 &
              pid=\$!
              sleep 12
              import -window root ../captures/vue_$v.png 2>/dev/null || true
              kill \$pid 2>/dev/null || true
              wait \$pid 2>/dev/null || true
            " || true
            if [ -s /tmp/$v.log ]; then
              echo "--- sortie de la vue $v ---"
              head -30 /tmp/$v.log
              echec=1
            else
              echo "aucune sortie d'erreur"
            fi
            ls -la ../captures/vue_$v.png 2>/dev/null || echo "pas de capture"
          done
          echo "des vues ont écrit sur la sortie d'erreur : $echec"

      # ------------------------------------------------------------------ #
      # L'ÉPREUVE QUI COMPTE (programme 23, bloc C) : on CASSE le Hub exprès,
      # dans les trois endroits où une exception peut naître, et on regarde
      # si le joueur voit quelque chose. Trois preuves par mode :
      #   - une CAPTURE (la fenêtre existe-t-elle à l'écran ?)
      #   - la LISTE DES FENÊTRES X11 (mesure, pas impression)
      #   - le FICHIER DE TRACE, et son contenu en entier
      # ------------------------------------------------------------------ #
      - name: Provoquer un plantage exprès — le joueur le voit-il ?
        working-directory: compagnon
        run: |
          set -eu
          mkdir -p ../captures
          rm -f dist/AscensionFR_incident.log
          for mode in rappel fil demarrage; do
            echo "════════════════════ --planter $mode ════════════════════"
            xvfb-run -a --server-args="-screen 0 1280x800x24" bash -c "
              openbox --sm-disable & sleep 2
              ./dist/AscensionFR_Hub --demo accueil --planter $mode \
                  > /tmp/planter_$mode.log 2>&1 &
              pid=\$!
              sleep 14
              echo '--- fenêtres X11 réellement affichées (mesure) ---'
              xwininfo -root -children | grep -E '^ +0x' || true
              import -window root ../captures/plantage_$mode.png 2>/dev/null || true
              kill \$pid 2>/dev/null || true
              wait \$pid 2>/dev/null || true
            " || true
            echo "--- ce qui est parti sur la sortie standard (le joueur ne la voit pas) ---"
            head -5 /tmp/planter_$mode.log || true
            ls -la ../captures/plantage_$mode.png 2>/dev/null || echo "PAS DE CAPTURE"
          done
          echo
          echo "════════════ LE FICHIER DE TRACE, EN ENTIER ════════════"
          if [ -f dist/AscensionFR_incident.log ]; then
            wc -c dist/AscensionFR_incident.log
            cat dist/AscensionFR_incident.log
          else
            echo "::error::AUCUNE trace écrite — la réparation ne tient pas."
            exit 1
          fi

      # Une trace finit collée sur le Discord. On ne se contente donc pas de
      # la lire : on CHERCHE dedans ce qui ne doit jamais y être.
      - name: La trace est-elle propre ? (webhook, identité, chemins)
        working-directory: compagnon
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_RAPPORTS }}
        run: |
          set -eu
          python - <<'PY'
          import io, os, re, sys
          texte = io.open("dist/AscensionFR_incident.log",
                          encoding="utf-8").read()
          fautes = []
          secret = os.environ.get("WEBHOOK") or ""
          if secret and secret in texte:
              fautes.append("le webhook est DANS la trace")
          if re.search(r"discord(?:app)?\.com/api/webhooks/\w", texte):
              fautes.append("une URL de webhook est dans la trace")
          maison = os.path.expanduser("~")
          if maison and maison != "~" and maison in texte:
              fautes.append("le dossier personnel (%s) est dans la trace"
                            % maison)
          for cle in ("USER", "USERNAME", "LOGNAME"):
              nom = os.environ.get(cle, "")
              if len(nom) >= 3 and nom.lower() in texte.lower():
                  fautes.append("le nom d'utilisateur (%s) est dans la trace"
                                % nom)
          if re.search(r"WTF[\\/]+Account[\\/]+(?!<compte>)", texte):
              fautes.append("un nom de compte WoW est dans la trace")
          # …et ce qui DOIT y être, sinon la trace ne sert à rien.
          for morceau in ("Pendant :", "Traceback", "Hub 3."):
              if morceau not in texte:
                  fautes.append("« %s » MANQUE dans la trace" % morceau)
          for f in fautes:
              print("::error::%s" % f)
          print("longueur de la trace : %d octets" % len(texte))
          print("verdict :", "PROPRE" if not fautes else "SALE")
          sys.exit(1 if fautes else 0)
          PY

      # Les 98 fichiers d'assets/hub sont-ils embarqués, et les polices du jeu
      # sont-elles réellement CHARGÉES ? Ce sont deux questions différentes :
      # `charger_polices()` passe par ctypes.windll.gdi32, une API Windows.
      - name: Vérifier les assets embarqués et le sort des polices
        working-directory: compagnon
        run: |
          set -eu
          echo "--- les assets sont-ils dans le binaire ? ---"
          for motif in decor_hub.json catalogue_hub.json MORPHEUS.TTF FRIZQT__.TTF fond.png; do
            n=$(grep -a -c "$motif" dist/AscensionFR_Hub || true)
            echo "  $motif : $n occurrence(s) dans le binaire"
          done
          echo "--- charger_polices() peut-il fonctionner ici ? ---"
          python - <<'PY'
          import ctypes
          print("ctypes a-t-il windll (API Windows) :", hasattr(ctypes, "windll"))
          PY

      - name: Prouver que le binaire porte le webhook, sans le montrer
        if: env.MODE == 'distribution'
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_RAPPORTS }}
        run: |
          set -eu
          python - <<'PY'
          import hashlib, os, re, sys, zlib

          secret = os.environ["WEBHOOK"].encode()
          donnees = open("compagnon/dist/AscensionFR_Hub", "rb").read()
          print("taille du binaire : %.1f Mo" % (len(donnees) / 1048576))
          print("empreinte SHA-256 du binaire :",
                hashlib.sha256(donnees).hexdigest())
          # Une empreinte tronquée du SECRET : elle ne révèle rien (non
          # inversible) mais permet de vérifier qu'il s'agit bien du bon
          # webhook, sans jamais l'écrire.
          print("empreinte du secret (16 premiers hex) :",
                hashlib.sha256(secret).hexdigest()[:16])

          # PREMIER ESSAI, ET POURQUOI IL ÉTAIT FAUX. Chercher les octets du
          # secret en clair rend 0 : PyInstaller ne stocke pas le source, il
          # stocke le BYTECODE dans une archive PYZ **compressée en zlib**.
          # L'absence en clair ne prouve donc rien — il faut décompresser.
          clair = donnees.count(secret)
          print("occurrences en clair dans le binaire :", clair)

          # On balaie les en-têtes zlib plausibles et on tente de décompresser.
          # La plupart échouent aussitôt (faux en-têtes) ; celui de la PYZ,
          # lui, rend le bytecode où le secret figure comme constante.
          trouve = essais = 0
          for m in re.finditer(rb"\x78[\x01\x5e\x9c\xda]", donnees):
              essais += 1
              try:
                  sortie = zlib.decompressobj().decompress(
                      donnees[m.start():], 64 << 20)
              except zlib.error:
                  continue
              if secret in sortie:
                  trouve += 1
          print("flux zlib essayés :", essais)
          print("flux zlib décompressés contenant le webhook :", trouve)

          if trouve < 1:
              print("::error::le webhook n'est retrouvé nulle part dans le binaire")
              sys.exit(1)
          print("le binaire porte bien le webhook (jamais affiché).")
          PY

      # Le coureur est jetable, mais on le dit quand même : un `git add -A`
      # ajouté un jour par distraction publierait le webhook.
      - name: Prouver que rien de modifié ne peut être poussé
        run: |
          set -eu
          echo "--- fichiers modifiés dans le coureur ---"
          git status --porcelain || true
          echo "--- le jeton est en lecture seule (permissions: contents: read) ---"
          echo "aucun push n'est possible depuis ce workflow."

      # Les captures partent TOUJOURS : elles ne contiennent aucun secret.
      - name: Exporter les captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: captures-linux-${{ inputs.mode }}
          path: captures/
          retention-days: 7
          if-no-files-found: warn

      # LE BINAIRE NE PART QU'EN MODE DISTRIBUTION. En diagnostic, cette étape
      # ne s'exécute pas : un binaire sans webhook ne peut donc pas circuler.
      - name: Exporter le binaire en ARTEFACT (jamais en release)
        if: env.MODE == 'distribution'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: AscensionFR_Hub-linux
          path: compagnon/dist/AscensionFR_Hub
          retention-days: 7
          if-no-files-found: error
